# newfc HTTPS 反向代理示例：部署前替换域名并通过 certbot 准备证书。
# newfc 需 NEWFC_TRUST_PROXY=1:按 X-Forwarded-Proto 设置 Secure Cookie,按真实客户端 IP 限流/锁定。
server {
    server_name finance.example.com;

    # 上传上限略高于 newfc 默认 10 MiB(NEWFC_MAX_UPLOAD_BYTES),超限由后端给出明确错误
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3760;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        # 助手问答为 SSE 流式输出,关闭缓冲以便逐段下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/finance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}

server {
    if ($host = finance.example.com) {
        return 301 https://$host$request_uri;
    }


    server_name finance.example.com;

    listen 80;
    listen [::]:80;
    return 404;


}