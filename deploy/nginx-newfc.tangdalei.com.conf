# newfc(127.0.0.1:3760)反向代理。独立站点,不改动 newbd 等其他站点。
# newfc 需 NEWFC_TRUST_PROXY=1:按 X-Forwarded-Proto 设置 Secure Cookie,按真实客户端 IP 限流/锁定。
server {
    server_name newfc.tangdalei.com;

    # 上传上限略高于 newfc 默认 10 MiB(NEWFC_MAX_UPLOAD_BYTES),超限由后端给出明确错误
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3760;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        # 助手问答为 SSE 流式输出,关闭缓冲以便逐段下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/newfc.tangdalei.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/newfc.tangdalei.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = newfc.tangdalei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name newfc.tangdalei.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}